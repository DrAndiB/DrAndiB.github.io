/* Layout: a full-screen map; scenarios left, outcomes right, flow and time controls in a dock below. */
:root{--ink:#1c1b19;--ink2:#5f5b54;--paper:rgba(249,248,245,.90);--line:rgba(28,27,25,.14);--accent:#cf5f27;--accent2:#2f7fc1;--chip:rgba(28,27,25,.06);
  --sea:#e7e4de;--land:#f6f4ef;--border:rgba(28,27,25,.28);--grat:rgba(28,27,25,.05);--halo:rgba(246,244,239,.92);--good:#2e7d4f;--bad:#b3382c;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--serif:"Instrument Serif",Georgia,serif;color-scheme:light}
body.night{--ink:#e9f5ff;--ink2:#8eb4cf;--paper:rgba(5,12,26,.80);--line:rgba(110,200,255,.22);--accent:#e2903b;--accent2:#36a9dc;--chip:rgba(110,200,255,.09);
  --sea:#050c1a;--land:#0a1830;--border:rgba(110,200,255,.34);--grat:rgba(110,200,255,.06);--halo:rgba(5,12,26,.88);--good:#5fd39a;--bad:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--sea);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
#map{position:absolute;inset:0;display:block;touch-action:none;cursor:grab}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.glass{background:var(--paper);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.brand{padding:8px 14px;min-width:0}

mbourg","node.europe":"Europe","node.FR":"France","node.BE":"Belgium","node.DE":"Germany","node.paris":"France","node.brussels":"Belgium","node.frankfurt":"Germany","node.london":"United Kingdom","node.amsterdam":"Netherlands","node.zurich":"Switzerland","node.milan":"Italy","node.madrid":"Spain","node.lisbon":"Portugal","node.dublin":"Ireland","node.stockholm":"Nordic countries","node.warsaw":"Other EU","node.beyond":"Outside Europe","node.newyork":"United States","node.saopaulo":"Latin America","node.lagos":"Africa","node.mumbai":"South Asia","node.hongkong":"East Asia","node.tokyo":"Japan","node.gulf":"Gulf states","unit.k":"{v} thousand","unit.bn":"EUR {v} bn","unit.perYear":"per year","legend.in":"Into Luxembourg","legend.out":"Out of Luxembourg","legend.ghost":"Passing through","legend.base":"Baseline size","legend.width":"Drag the map to turn it. Bar height and line width show size in","legend.assumed":"Totals come from the model. The split by country is assumed.","legend.vsBase":"vs baseline","scen.title":"Scenarios","scen.hint":"Switch on one or several. Each has a size and a start year.","scen.reset":"Clear all","scen.size":"Size","scen.start":"Starts","scen.none":"Baseline only","scen.active":"{n} active","fam.global":"Global shocks","fam.lux":"Luxembourg structural","fam.tech":"Technology and AI","fam.demo":"Demographics and climate","basis.history":"Past episode","basis.source":"Published projection","basis.literature":"Published model","basis.assumption":"Assumption","scen.crisis.name":"Global financial crisis","scen.crisis.desc":"Markets fall by a fifth, investors pull money, the euro area shrinks by 4% and recovers half.","scen.tradewar.name":"Trade war","scen.tradewar.desc":"Three years of weaker euro area demand and a market dip, hitting industry hardest, then traded services and finance.","scen.energy.name":"Energy price spike","scen.energy.desc":"Energy prices jump by 80% and take three years to settle at a higher level.","scen.stagnation.name":"Euro area stagnation","scen.stagnation.desc":"A decade with euro area growth one point lower and weaker markets.","scen.cmu.name":"Deeper EU capital markets","scen.cmu.desc":"More European savings go into cross-border funds, a business Luxembourg leads.","scen.saturation.name":"Commuter pool saturates","scen.saturation.desc":"Fewer people in the border regions are able or willing to commute. Pay rises and growth slows.","scen.friction.name":"Border and telework friction","scen.friction.desc":"Controls, congestion and tax rules make working across the border less attractive.","scen.housing.name":"Housing","scen.housing.desc":"Building either stays at today's 2,800 homes a year or climbs to its record of 4,400.","scen.housing.plus":"Build-out","scen.housing.minus":"Gridlock","scen.pension.name":"Pension reform","scen.pension.desc":"Contributions rise by two points, people retire later, benefits grow more slowly.","scen.erosion.name":"Financial centre erosion","scen.erosion.desc":"Tax harmonisation and rival centres pull funds and tax revenue away.","scen.aiboom.name":"Broad AI productivity boom","scen.aiboom.desc":"A decade of faster productivity growth in Luxembourg and its neighbours alike.","scen.automation.name":"Automation of fund administration","scen.automation.desc":"The same assets need far fewer people. Finance output holds, finance jobs do not; the saving goes to profits and pay.","scen.compute.name":"Compute and data-centre build-out","scen.compute.desc":"Six years of heavy investment, more digital services to sell, more electricity to import.","scen.niche.name":"New financial niche succeeds","scen.niche.desc":"Luxembourg becomes the home of a new asset class, as it did for cross-border funds.","scen.laggard.name":"Slower AI adoption than the neighbours","scen.laggard.desc":"France, Belgium and Germany pull ahead. Working in Luxembourg pays less of a premium and some business is lost.","scen.ageing.name":"Faster ageing in the Greater Region","scen.ageing.desc":"The border regions lose workers faster and compete harder for those who remain.","scen.immigration.name":"Immigration","scen.immigration.desc":"More, or fewer, foreign workers choose to settle in Luxembourg.","scen.immigration.plus":"Higher","scen.immigration.minus":"Lower","scen.worklonger.name":"Longer working lives","scen.worklonger.desc":"People aged 55 to 69 stay in work, closing part of the gap to the legal retirement age.","scen.carbon.name":"Carbon price rise, end of fuel tourism","scen.carbon.desc":"Fuel sales to non-residents fade and energy costs more.","scen.transition.name":"Energy transition investment push","scen.transition.desc":"Ten years of extra public and private investment, then a falling energy import bill.","out.title":"Outcomes","out.h5":"5 years","out.h10":"10 years","out.h20":"20 years","out.income.title":"Income","out.jobs.title":"Jobs and people","out.public.title":"Public finances","out.housing.title":"Housing","m.gniPerHead":"GNI per resident","m.gdp":"GDP","m.gniShare":"GNI share of GDP","m.jobsSplit":"Jobs by residence","m.comShare":"Commuter share","m.pop":"Residents","m.debtPct":"Debt","m.balancePct":"Balance","m.reserveYears":"Pension reserve","m.housing":"Pressure","m.shortfall":"Dwellings missing","u.kEur":"EUR thousand, 2025 prices","u.bn":"EUR bn, 2025 prices","u.pct":"% of GDP","u.pctJobs":"% of jobs","u.k":"thousand","u.years":"years of benefits","u.index":"index, 2025 = 100","u.kDw":"thousand dwellings","out.vsBase":"{d} vs baseline","out.legendBase":"Baseline","out.legendScen":"With scenarios","out.legendBand":"Half and 90% of 200 simulated futures","out.res":"Residents","out.com":"Commuters","out.noPolicy":"Debt assumes no policy change. Governments would act before it reached this level.","dock.play":"Play","dock.pause":"Pause","story.1.title":"Nearly half the workforce crosses a border","story.1.body":"In 2025, {commuters} thousand people commuted into Luxembourg, {share}% of all jobs. More than half live in France. This is the flow that makes the country different.","story.2.title":"A mountain of money passes through","story.2.body":"Luxembourg funds hold EUR {aum} bn, about {times} times the country's yearly output. The faint streams are that money. Inside, the financial centre is the slice that turns into GDP.","story.3.title":"GDP is not what residents earn","story.3.body":"EUR {wx} bn of pay goes home with commuters every year, and profits flow to foreign owners. Residents keep about {gni}% of GDP. The right-hand side of the picture shows the split.","story.4.title":"The baseline to 2046","story.4.body":"With no scenario switched on, the economy grows by about {g}% a year, jobs reach {jobs} thousand and commuters fill {share}% of them. Press play to watch it unfold.","story.5.title":"What if the commuters stop coming?","story.5.body":"If the border regions run short of people willing to commute, pay rises, firms sell less and growth slows. By 2046 GDP is {gdp}% lower and the budget balance {bal} points weaker than in the baseline.","story.6.title":"What if machines do the fund paperwork?","story.6.body":"Finance needs {fin} thousand fewer people by 2046 for the same output. The saving goes to profits and pay, and spending at home creates jobs elsewhere. Total jobs dip by up to {dip} thousand before they recover. GDP ends {gdp}% above the baseline and the budget balance {bal} points stronger.","story.7.title":"Your turn","story.7.body":"Combine scenarios, change their size and timing, switch between flows and zoom levels. Every assumption is listed under *How it works*.","story.next":"Next","story.back":"Back","story.done":"Explore","story.close":"Close tour","method.title":"How the simulator works","method.tabHow":"The model","method.tabChecks":"Checks","method.tabParams":"Parameters","method.tabLimits":"Limits","method.close":"Close","method.how.1":"What Luxembourg can sell comes first. Each export sector has a trend, follows fund assets or euro area demand, and gains or loses sales with its costs against competitors. The responses to assets and to euro area demand are estimated; traded services and industry react 2.7 times as strongly as the average outside finance, set so that the total matches the estimate. Productivity gained beyond the baseline is sold directly. Local services follow population and last year's income.","method.how.2":"Output per job decides how many workers that takes. Residents, immigrants and commuters from France, Belgium and Germany decide how many are available. Fewer commuters come forward as the border districts fill up.","method.how.3":"Pay balances the two. It follows pay next door, takes most of any productivity lead, and rises faster when firms want more workers than come forward or when housing gets scarcer. Higher pay makes Luxembourg more attractive to foreign workers and more expensive for its customers. In a slump commuters carry about two thirds of the job losses at first. Half of the residents who lost their job find work again each year, in place of new foreign hires.","method.how.4":"Housing decides how many foreign workers come and where they live. The scarcer homes become, the fewer come at all, the more of them commute, and the more residents move across the border.","method.how.5":"Every tax is a rate times something the model produces: wages, profits, fund assets, spending. The budget starts at the 2025 deficit. The part of it beyond the 2023 to 2025 average fades by 2028; ageing then weighs on the balance again. Pensions already earned are fixed; contributions move with jobs and pay. When the pension reserve is empty, the state covers the shortfall and debt rises.","method.checks.intro":"The baseline is compared with published official figures. A gap is not an error in itself, but it has to be explained. Four are not explained yet: the first year falls short of STATEC's forecast, long-run growth and the number of residents end above the published figures, and under the 2026 rules the pension reserve lasts four years longer than in the government's figure. The three old-rules pension rows are not independent checks: benefit growth was set to land near them.","method.checks.colWhat":"Check","method.checks.colModel":"This model","method.checks.colRef":"Published","method.checks.colSrc":"Source","chk.gdp":"GDP growth 2026 to 2029","chk.jobs":"Jobs growth 2026 to 2029","chk.gni":"GNI as share of GDP","chk.long":"Average GDP growth to 2046","chk.pop":"Residents in 2046","chk.com":"Commuter share of jobs, 2046","chk.prem":"Pension costs exceed a 24% rate, old rules","chk.min":"Reserve below 1.5 years, old rules","chk.out":"Reserve empty, old rules","chk.min2":"Reserve below 1.5 years, 2026 rules","chk.srcStatec":"STATEC, February 2026","chk.srcCnfp":"CNFP, 2024 figure","chk.srcIgss":"IGSS, July 2024","chk.srcIgssLong":"IGSS baseline, 2022 to 2070","chk.srcStatecLong":"STATEC scenarios: about 1 million by 2070","chk.srcBcl":"BCL, range for 2060","chk.srcGov":"Government, December 2025","chk.after":"after 2046","method.params.intro":"The model's parameters, with where each comes from. Data is a published figure. Literature comes from a published model, study or projection. Estimated comes from the quarterly data and has a 90% interval. An assumption is a judgement. The fan charts draw from every range shown. About 40 further constants are fixed in the code and not varied: age profiles, tax weights, the rules for construction and energy, and how slack is shared.","method.params.colWhat":"Parameter","method.params.colValue":"Value","method.params.colRange":"Range","method.params.colLabel":"Basis","label.data":"Data","label.literature":"Literature","label.assumption":"Assumption","label.estimated":"Estimated","method.params.count":"{n} parameters: {d} data, {l} literature, {e} estimated, {a} assumptions","method.limits.1":"The estimated responses rest on about 100 quarters of data. Their intervals are wide and probably still too narrow. The effect of interest rates on finance could not be pinned down and is set to zero. The estimation method treats every shock as lasting, and the model applies the estimates to shifts that last a decade.","method.limits.2":"More than half the parameters are assumptions. They were set so that the baseline lands near the official projections, which is a weaker test than fitting history. How fast pay reacts, how strongly sales react to costs and how much extra productivity is sold directly matter most for the long run, and all three are assumptions.","method.limits.3":"A lasting loss of foreign demand stays a lasting loss: pay adjusts and recovers about a fifth of it. Whether Luxembourg would recover more by moving into new activities is outside the model.","method.limits.4":"Pay is the only price. There is no inflation, no house prices and no exchange rate. Productivity abroad plays two roles that scenarios set separately: competitors' productivity and customers' income. Splits by partner country on the map are fixed shares.","method.limits.5":"Public finances assume no policy change. Debt paths show pressure, not what would happen. If none of the 2025 deficit faded, debt in 2046 would be about 20 points higher.","method.limits.6":"GNI per resident is not a measure of welfare. It rises when workers commute instead of settling, because fewer residents share the income, and it ignores housing costs. This is why a housing gridlock shows slightly higher income per resident and no cost to the budget.","lens.title":"Luxembourg","pool.jobs":"Jobs","pool.residents":"Residents","pool.gdp":"GDP and pay from abroad","pool.supply":"Goods and services available","pool.budget":"Public budget","in.resWorkers":"Residents","in.fromFR":"From France","in.fromBE":"From Belgium","in.fromDE":"From Germany","use.secF":"Finance","use.secT":"Digital and business services","use.secI":"Industry and construction","use.secD":"Trade, transport, public and other services","in.pop2025":"Living here in 2025","in.arrived":"Arrived since, net","in.natural":"Births minus deaths since","use.inWork":"In work","use.notInWork":"Children, retired, others","in.vaF":"Financial centre","in.vaT":"Digital and business services","in.vaI":"Industry and construction","in.vaD":"Trade, transport, public and other services","use.gniHome":"Stays with residents","use.commuterPay":"Commuter pay","use.propertyIncome":"Profits to foreign owners","in.imports":"Bought abroad","in.made":"Made in Luxembourg","use.exports":"Sold abroad","use.usedHere":"Used in Luxembourg","in.taxCommuters":"Commuters' tax and contributions","in.taxFinance":"Tax on funds and financial firms","in.taxResidents":"Residents and other firms","in.borrowing":"Borrowing","use.servicesHome":"Services and investment at home","use.benefitsAbroad":"Pensions and benefits paid abroad","use.surplus":"Surplus outside pensions","legend.stays":"Stays","legend.domestic":"From within","kind.propertyIncome":"Profits paid to foreign owners","m.wIdx":"Real pay per job","m.unempRate":"Unemployment","u.pctLf":"% of residents in the labour force","in.payAbroad":"Pay residents earn abroad","method.how.6":"How strongly output and jobs react to euro area growth and to fund assets is estimated from quarterly data since 2001, and the same strength applies to the baseline and to scenarios. Each scenario shifts a handful of inputs. The fan charts run 200 random futures with different markets, euro area growth, energy prices and parameter values.","method.props.title":"How the model behaves","method.props.intro":"Four standard experiments, each starting in 2028 and compared with the baseline. They show what the model assumes about recovery and about supply.","method.props.colWhat":"Experiment","method.props.colGdp":"GDP after 1 and 10 years","method.props.colOther":"Also","prop.slump":"Euro area output 4% lower for two years, then back (also: peak unemployment)","prop.loss":"Euro area output 4% lower for good (also: peak unemployment)","prop.prod":"Productivity growth one point higher for ten years; GDP after 10 and 18 years (also: pay and jobs in 2046)","prop.work":"Longer working lives: 15 points more of the 60 to 64 year olds in work, 6 points more of those aged 55 to 59 and 65 to 69; GDP after 10 and 18 years (also: commuters in 2046)","chk.srcEurostat":"Eurostat projection, 2023 base","method.limits.7":"The baseline rests on assumed sector trends. Finance output grows 2.0% a year here; in the volume data for 2010 to 2025 it grew 0.9%. With a finance trend in line with that history, average growth would be 1.65% and debt in 2046 about 61% of GDP instead of 45%. The fan charts do not reach that far.","in.fromReserve":"Drawn from the pension reserve","use.toReserve":"Added to the pension reserve","method.limits.8":"By the 2040s firms want more foreign workers than come forward each year. Pay drifts above productivity and a small share of jobs stays unfilled. The horizon ends before the commuter ceilings bind fully; beyond 2046 the squeeze would tighten.","method.limits.9":"Some channels are missing or one-sided. Productivity gains in local services, half of all jobs, cost jobs because cheaper services do not raise demand. A swing in demand changes output per job for good without reaching pay. A higher energy import bill does not lower household income. Higher pension contributions cost no jobs.","method.limits.10":"An AI model briefed as a sceptical macroeconomist reviewed versions 0.1, 0.2 and 0.3. It found none fit for publication and called the third close. This version fixes what the third review said must be fixed and discloses the rest here. It has not been reviewed again, and no human economist has reviewed the model.","hud.demo":"Demo","param.gdp0":"Eurostat nama_10_gdp, GDP at current prices 2025 (EUR bn)","param.pop0":"STATEC, residents on 1 January 2026 (thousand)","param.commuters0":"STATEC B3002, salaried cross-border workers 2025 average, plus 3% self-employed","param.shareFR":"STATEC B3002, 2025","param.shareBE":"STATEC B3002, 2025","param.shareDE":"STATEC B3002, 2025","param.resJobs0":"Eurostat domestic employment 2025 less cross-border workers","param.outbound0":"STATEC Regards 01/2026, residents working for foreign or international employers (thousand)","param.aum0":"STATEC D7300, net assets of Luxembourg funds end 2025 (EUR bn)","param.debt0":"Eurostat gov_10dd_edpt1, general government debt 2025 (EUR bn)","param.reserve0":"Pension reserve 2025 (EUR bn); IGSS reports 31.4% of GDP in 2022","param.benefits0":"General-scheme pension benefits 2025 (EUR bn), from reserve = 4.4 years of benefits (IGSS)","param.exports0":"Eurostat nama_10_gdp, exports of goods and services 2025 (EUR bn)","param.imports0":"Eurostat nama_10_gdp, imports of goods and services 2025 (EUR bn)","param.gniGap0":"CNFP note April 2026: GDP minus GNI was 34.6% of GDP in 2024","param.vaF":"Eurostat nama_10_a10, share of value added 2025","param.vaT":"Eurostat nama_10_a10, share of value added 2025","param.vaI":"Eurostat nama_10_a10, share of value added 2025","param.jobF":"Eurostat nama_10_a10_e, share of domestic employment 2025","param.jobT":"Eurostat nama_10_a10_e, share of domestic employment 2025","param.jobI":"Eurostat nama_10_a10_e, share of domestic employment 2025","param.wF":"Eurostat nama_10_a10, compensation per employee 2025 (EUR thousand)","param.wT":"Eurostat nama_10_a10, compensation per employee 2025 (EUR thousand)","param.wI":"Eurostat nama_10_a10, compensation per employee 2025 (EUR thousand)","param.wD":"Eurostat nama_10_a10, compensation per employee 2025 (EUR thousand)","param.commuterPay":"Commuter pay relative to average compensation per job; set so pay leaving the country matches EUR 17.1 bn in 2024 (CNFP)","param.eps":"Elasticity of foreign-worker inflow to relative income (STATEC Bulletin 3-17)","param.Fbar":"Foreign workers who come per year at today's relative income (thousand); set so the labour market starts in balance","param.sigma":"Share of foreign inflow that s
